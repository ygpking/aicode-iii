name: Docs

# 纯文档提交专用门禁。ci.yml 带 paths-ignore（'**.md' / 'docs-site/**'），
# 纯文档改动不触发它——而文档恰恰没有编译器兜底：表格里的 `|` 忘转义或误删换行，
# 渲染出来就是错列，本地探针、单测、架构检查全都发现不了。
# 已实测：引入 rc10 坏表格的那笔（只改一个 .md）在 GitHub 上只有 Android Release 一条 run。
#
# paths 必须与 check_doc_tables.py 的扫描面（DOCS_ROOT = docs-site/docs）一致：
# 触发面若大于扫描面（如笼统的 `**.md`），改别处的 md 会跑出一个必然 OK 的空跑，
# 即「跑了但什么也没查」的假绿。
#
# 这里只跑秒级的静态检查，不构建、不跑测试。
on:
  push:
    branches: [ main ]
    paths:
      - 'docs-site/docs/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs-site/docs/**'

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check doc tables
        run: python3 scripts/check_doc_tables.py

      # 判据自身的判别力自检：内嵌样例要求各自红/绿，不符即退 1。
      # 防止日后改这个脚本时把判据改瞎——那时常规检查仍会报绿，只有自检能发现。
      - name: Check doc tables self-test
        run: python3 scripts/check_doc_tables.py --self-test
